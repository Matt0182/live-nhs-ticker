<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#005EB8"><title>Live NHS Ticker</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%}body{font-family:Arial,Helvetica,sans-serif;background:#005EB8;color:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;overflow:hidden}.logo{position:absolute;top:20px;right:20px;width:clamp(100px,18vw,220px)}h1{font-size:clamp(2rem,6vw,5rem);margin:0 0 3vh}#ticker{width:100%;font-size:clamp(1.7rem,9vw,8rem);font-weight:700;white-space:nowrap;overflow:hidden;line-height:1.05;margin-bottom:2vh}.caption{color:#ffb81c;font-size:clamp(1rem,3vw,2rem)}.info,.status{max-width:92%;font-size:clamp(.75rem,2vw,1rem);line-height:1.35;margin-top:12px;color:rgba(255,255,255,.82)}.status{font-size:.75rem;color:rgba(255,255,255,.6)}.status a{color:#fff}@media(max-width:480px){body{padding:15px}.logo{top:15px;right:15px;width:100px}#ticker{font-size:clamp(1.7rem,10vw,3rem)}}
</style></head><body>
<img class="logo" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/National_Health_Service_%28England%29_logo.svg/3840px-National_Health_Service_%28England%29_logo.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" alt="NHS Logo">
<h1>Live NHS Ticker</h1><div id="ticker">£0.00</div><div class="caption">NHS spending since 1st January</div>
<div class="info" id="info">Loading latest NHS budget…</div><div class="status" id="status"></div>
<script>
const money=v=>"£"+v.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const seconds=y=>(Date.UTC(y+1,0,1)-Date.UTC(y,0,1))/1000;
(async()=>{try{const d=await (await fetch("budgets.json?v="+Date.now(),{cache:"no-store"})).json(),y=new Date().getFullYear(),b=d.budgets[y];
if(!b)throw Error("No budget snapshot");const start=new Date(y,0,1),rate=b.amount/seconds(y);
info.textContent=`Based on NHS England ${b.financialYear} total revenue resource use limit of ${money(b.amount)}.`;
status.innerHTML=`Official source: <a href="${b.sourceUrl}" target="_blank" rel="noopener">GOV.UK</a> · Data checked ${d.lastUpdated}`;
function tick(){const n=new Date();if(n.getFullYear()!=y)return location.reload();document.getElementById("ticker").textContent=money(Math.max(0,(n-start)/1000)*rate)}tick();setInterval(tick,50)
}catch(e){document.getElementById("info").textContent="Latest NHS budget data could not be loaded."}})();
</script></body></html>
