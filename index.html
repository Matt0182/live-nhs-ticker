<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#005EB8">
  <meta name="description" content="Live NHS England budget ticker">
  <title>Live NHS Ticker</title>
  <style>
    :root{--nhs-blue:#005eb8;--caption-orange:#ffb81c}
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{
      font-family:Arial,Helvetica,sans-serif;background:var(--nhs-blue);color:#fff;
      min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
      justify-content:center;align-items:center;text-align:center;overflow:hidden;padding:20px
    }
    .logo{position:absolute;top:20px;right:20px;width:clamp(100px,18vw,220px);height:auto}
    h1{color:#fff;font-size:clamp(2rem,6vw,5rem);line-height:1.1;margin:0 0 3vh}
    #ticker{width:100%;max-width:100%;color:#fff;font-size:clamp(1.7rem,9vw,8rem);
      font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;margin:0 0 2vh}
    .caption{color:var(--caption-orange);font-size:clamp(1rem,3vw,2rem);line-height:1.3;max-width:90%}
    .budget-info,.status{max-width:92%;font-size:clamp(.75rem,2vw,1rem);line-height:1.35;margin-top:12px;color:rgba(255,255,255,.82)}
    .status{font-size:.75rem;color:rgba(255,255,255,.58)}
    @media(max-width:480px){
      body{padding:15px}.logo{top:15px;right:15px;width:100px}
      h1{margin-bottom:25px}#ticker{font-size:clamp(1.7rem,10vw,3rem)}.caption{font-size:1.1rem}
    }
  </style>
</head>
<body>
  <img class="logo"
    src="https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/National_Health_Service_%28England%29_logo.svg/3840px-National_Health_Service_%28England%29_logo.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail"
    alt="NHS Logo">
  <h1>Live NHS Ticker</h1>
  <div id="ticker">£0.00</div>
  <div class="caption">NHS spending since 1st January</div>
  <div class="budget-info" id="budgetInfo">Loading latest NHS budget…</div>
  <div class="status" id="status"></div>

<script>
const DATA_URL = "budgets.json";
const ticker = document.getElementById("ticker");
const budgetInfo = document.getElementById("budgetInfo");
const status = document.getElementById("status");

function secondsInYear(year) {
  return (Date.UTC(year + 1,0,1) - Date.UTC(year,0,1)) / 1000;
}

function money(value) {
  return "£" + value.toLocaleString("en-GB", {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}

async function loadData() {
  const r = await fetch(DATA_URL + "?v=" + Date.now(), {cache:"no-store"});
  if (!r.ok) throw new Error("Budget data unavailable");
  return await r.json();
}

async function start() {
  try {
    const data = await loadData();
    const year = new Date().getFullYear();
    const entry = data.budgets[String(year)];

    if (!entry) {
      throw new Error("No budget has been published for " + year);
    }

    const start = new Date(year, 0, 1, 0, 0, 0, 0);
    const annualBudget = Number(entry.amount);
    const ratePerSecond = annualBudget / secondsInYear(year);

    budgetInfo.textContent =
      `Based on NHS England ${entry.financialYear} total revenue resource use limit of ${money(annualBudget)}.`;

    status.innerHTML =
      `Official source: <a href="${entry.sourceUrl}" target="_blank" rel="noopener" style="color:white">GOV.UK</a> · Data checked ${data.lastUpdated}`;

    function update() {
      const now = new Date();

      // At midnight on 1 January, reload and pick up the new year's data.
      if (now.getFullYear() !== year) {
        location.reload();
        return;
      }

      const elapsed = Math.max(0, (now - start) / 1000);
      ticker.textContent = money(elapsed * ratePerSecond);
    }

    update();
    setInterval(update, 50);

  } catch (err) {
    console.error(err);
    ticker.textContent = "£0.00";
    budgetInfo.textContent = "Latest NHS budget data could not be loaded.";
    status.textContent = "Please try again shortly.";
  }
}

start();
</script>
</body>
</html>
