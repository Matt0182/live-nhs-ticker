name: Update NHS budget

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-budget:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Research latest NHS budget
        run: python update_budget.py

      - name: Commit changes if required
        run: |
          git config user.name "NHS Ticker Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budgets.json
          if git diff --cached --quiet; then
            echo "No budget change."
          else
            git commit -m "Update NHS budget automatically"
            git push
          fi
